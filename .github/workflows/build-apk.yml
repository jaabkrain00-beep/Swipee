name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy fonts into app
        run: bash scripts/fetch-fonts.sh

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project (plugin, permissions, minSdk)
        run: bash scripts/patch-android.sh

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipeClean-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
